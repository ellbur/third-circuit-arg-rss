version: 0.2
phases:
  install:
    runtime-versions:
      # Match the Lambda runtime in template.yaml. Needs a CodeBuild image that
      # ships Node 22, e.g. aws/codebuild/amazonlinux2-x86_64-standard:5.0.
      nodejs: 22
  build:
    commands:
      # sam build stages the handler and installs production dependencies into
      # .aws-sam/build on its own, so there is no separate npm install or
      # prune step here to drift out of sync with package.json.
      - sam build
      # Stack name, artifact bucket, region and capabilities all come from
      # samconfig.toml. Tolerate an empty changeset so that re-running the
      # build with no source changes reports success instead of failing.
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
